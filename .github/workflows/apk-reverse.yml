name: APK Reverse Engineering

on:
  workflow_dispatch:
    inputs:
      parts_dir:
        description: 'Directory containing APK parts, e.g. reverse'
        required: true
        default: 'reverse'

permissions:
  contents: read
  actions: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble split APK
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ inputs.parts_dir }}"
          mkdir -p "$dir"
          shopt -s nullglob
          parts=("$dir"/base.apk.part*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No APK parts found in $dir"
            echo "Expected files such as reverse/base.apk.part01, reverse/base.apk.part02, ..."
            exit 1
          fi
          printf '%s\n' "${parts[@]}" | sort -V
          cat $(printf '%q ' "${parts[@]}" | sort -V) > "$dir/base.apk"
          echo "Reassembled APK: $(du -h "$dir/base.apk" | cut -f1)"
          sha256sum "$dir/base.apk"

      - name: Download JADX
        run: |
          curl -L -o jadx.zip https://github.com/skylot/jadx/releases/latest/download/jadx.zip
          unzip -q jadx.zip -d jadx

      - name: Download Apktool
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/latest/download/apktool.jar

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'

      - name: Verify input APK
        run: |
          test -f "${{ inputs.parts_dir }}/base.apk"
          sha256sum "${{ inputs.parts_dir }}/base.apk"
          unzip -l "${{ inputs.parts_dir }}/base.apk" | head -80

      - name: Decode APK with Apktool
        run: java -jar apktool.jar d "${{ inputs.parts_dir }}/base.apk" -o decoded --force

      - name: Decompile DEX with JADX
        run: ./jadx/bin/jadx -d jadx-out "${{ inputs.parts_dir }}/base.apk" || true

      - name: Locate Tint and white-balance code
        run: |
          grep -RniE 'ManualWhiteBalance|manualWhiteBalance|COLOR_CORRECTION_GAINS|COLOR_CORRECTION_TRANSFORM|tint=' decoded jadx-out 2>/dev/null | head -300 > tint-search.txt || true
          cat tint-search.txt

      - name: Package analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gcam-reverse-analysis
          path: |
            tint-search.txt
            jadx-out
            decoded/smali*
          retention-days: 7
