name: APK Reverse Engineering
on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Release 的 base.apk
        uses: dsaltares/fetch-gh-release-asset@v1
        with:
          repository: ${{ github.repository }}
          tag: v1.0
          asset: base.apk
          file-name: base.apk

      - name: 安装 apktool
        run: |
          sudo apt update
          sudo apt install apktool -y

      - name: 反编译APK
        run: apktool d base.apk -o output

      - name: 上传反编译结果
        uses: actions/upload-artifact@v4
        with:
          path: output
