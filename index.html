<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>每日学习打卡</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f3f6f4;color:#26332d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:600px;margin:auto;padding:20px 16px 90px}.head{text-align:center;margin-bottom:22px}.title{font-size:27px;font-weight:700}.date{color:#718078;margin-top:7px}.progress,.task,.history-item{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000009}.ptext{display:flex;justify-content:space-between;color:#5c6b64;margin-bottom:9px}.bar{height:10px;background:#e7ece9;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#62a982}.task{padding:18px}.th{display:flex;gap:12px;align-items:flex-start;margin-bottom:15px}.num{width:34px;height:34px;min-width:34px;border-radius:50%;background:#e6f1eb;color:#4e8d6c;display:grid;place-items:center;font-weight:700}.done .num{background:#62a982;color:white}.tt{font-size:18px;font-weight:650}.status{font-size:14px;color:#7b8982;margin-top:4px}.done .status{color:#4e8d6c}button{width:100%;min-height:52px;border:0;border-radius:13px;background:#62a982;color:#fff;font-size:17px;font-weight:600;padding:10px 16px}button:active{opacity:.8}.secondary{background:#e8efeb;color:#466454}.preview{background:#f5f7f6;padding:12px;border-radius:10px;margin-bottom:14px;color:#58665f;word-break:break-word}.modal{display:none;position:fixed;inset:0;background:#19231e73;z-index:10;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:480px}.box h2{margin:0 0 16px;font-size:21px}.words{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.word{background:#f1f6f3;color:#426551;border-radius:11px;padding:13px;text-align:center;font-weight:600}.buttons{display:flex;gap:10px}.buttons button{flex:1}input{width:100%;height:54px;border:1px solid #d7e0da;border-radius:12px;padding:0 14px;font-size:16px;margin-bottom:14px;outline:0}.history{display:none}.history-date{font-size:14px;color:#6c7a73;margin-bottom:6px}.footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #e5ebe7;padding:13px;text-align:center;font-size:17px;font-weight:650;color:#42554b;z-index:5}</style></head><body><main class="wrap"><div class="head"><div class="title">每日学习打卡</div><div class="date" id="date"></div></div><section class="progress"><div class="ptext"><span>今日学习进度</span><span id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="task" id="t1"><div class="th"><div class="num">1</div><div><div class="tt">背5个编程英语单词</div><div class="status">今天还没有完成</div></div></div><button id="b1">开始背单词</button></section><section class="task" id="t2"><div class="th"><div class="num">2</div><div><div class="tt">看10分钟 Linux 入门视频</div><div class="status">今天还没有完成</div></div></div><button id="b2">完成打卡</button></section><section class="task" id="t3"><div class="th"><div class="num">3</div><div><div class="tt">搜一次报错并记录</div><div class="status">今天还没有完成</div></div></div><div id="preview"></div><button id="b3">记录今天的报错</button></section><button class="secondary" id="histBtn">查看历史记录</button><div class="history" id="history"></div></main><div class="modal" id="wordModal"><div class="box"><h2>今天的5个编程英语单词</h2><div class="words"><div class="word">error</div><div class="word">function</div><div class="word">variable</div><div class="word">permission</div><div class="word">dependency</div></div><div class="buttons"><button class="secondary" id="closeWord">再看看</button><button id="finishWord">已背</button></div></div></div><div class="modal" id="errorModal"><div class="box"><h2>记录今天的报错</h2><input id="errorInput" placeholder="例如：BUILD FAILED / JVM-target compatibility"><div class="buttons"><button class="secondary" id="cancel">取消</button><button id="save">保存并完成</button></div></div></div><div class="footer">今天完成了 <span id="count">0</span>/3 项</div><script>const K='studyData',H='studyHistory',key=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},label=()=>{let d=new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'};document.getElementById('date').textContent=label();let data=JSON.parse(localStorage.getItem(K)||'{}');if(data.date!==key()){data={date:key(),a:false,b:false,c:false,error:''};localStorage.setItem(K,JSON.stringify(data))}function save(){localStorage.setItem(K,JSON.stringify(data))}function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}function ui(){let n=[data.a,data.b,data.c].filter(Boolean).length;document.getElementById('count').textContent=n;document.getElementById('pct').textContent=Math.round(n/3*100)+'%';document.getElementById('fill').style.width=n/3*100+'%';[[1,'a'],[2,'b'],[3,'c']].forEach(([i,k])=>{let t=document.getElementById('t'+i),s=t.querySelector('.status'),b=document.getElementById('b'+i);if(data[k]){t.classList.add('done');s.textContent='✓ 今天已完成';b.textContent='已完成'}else{t.classList.remove('done');s.textContent='今天还没有完成';b.textContent=i===1?'开始背单词':i===2?'完成打卡':'记录今天的报错'}});document.getElementById('preview').innerHTML=data.error?'<div class="preview">今日记录：'+esc(data.error)+'</div>':''}b1.onclick=()=>{if(!data.a)wordModal.classList.add('show')};closeWord.onclick=()=>wordModal.classList.remove('show');finishWord.onclick=()=>{data.a=true;save();ui();wordModal.classList.remove('show')};b2.onclick=()=>{if(!data.b){data.b=true;save();ui()}};b3.onclick=()=>{if(!data.c){errorInput.value='';errorModal.classList.add('show');setTimeout(()=>errorInput.focus(),100)}};cancel.onclick=()=>errorModal.classList.remove('show');save.onclick=()=>{let v=errorInput.value.trim();if(!v)return;data.c=true;data.error=v;save();let h=JSON.parse(localStorage.getItem(H)||'[]');h.unshift({date:label(),key:key(),content:v});let seen=new Set();h=h.filter(x=>{let q=x.key+'|'+x.content;if(seen.has(q))return false;seen.add(q);return true}).slice(0,100);localStorage.setItem(H,JSON.stringify(h));errorModal.classList.remove('show');ui();showHistory()};function showHistory(){let h=JSON.parse(localStorage.getItem(H)||'[]'),box=document.getElementById('history');box.innerHTML=h.length?h.map(x=>'<div class="history-item"><div class="history-date">'+esc(x.date)+'</div><div>'+esc(x.content)+'</div></div>').join(''):'<div class="history-item">还没有历史报错记录。</div>'}histBtn.onclick=()=>{if(history.style.display==='block'){history.style.display='none';histBtn.textContent='查看历史记录'}else{showHistory();history.style.display='block';histBtn.textContent='收起历史记录'}};function midnight(){let n=new Date(),t=new Date(n);t.setHours(24,0,0,0);setTimeout(()=>{data={date:key(),a:false,b:false,c:false,error:''};save();location.reload()},t-n+500)}ui();midnight();</script></body></html>
